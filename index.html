<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade B Streak</title>
<meta name="description" content="Streak-based daily planner for the RBI Grade B exam, built on EduTap's 9-month two-shift study plan.">
<meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1522" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grade B">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #EDEFF2; --surface: #FFFFFF; --surface-2: #F5F6F9;
    --ink: #141E36; --ink-2: #4A5468; --ink-3: #7B8497;
    --line: #D6DAE3; --line-2: #E5E8EE;
    --primary: #24408E; --primary-ink: #FFFFFF; --primary-soft: #E3E8F6;
    --accent: #D9822B; --accent-soft: #FBEBD9; --accent-ink: #7A4310;
    --good: #2F8F5B; --good-soft: #DFF1E6; --warn: #B8432E; --warn-soft: #F8E3DE;
    --heat-0: #E1E4EA; --heat-1: #F4D2A6; --heat-2: #E89F55; --heat-3: #C2611B;
    --pattern: rgba(36, 64, 142, 0.07);
    --shadow: 0 1px 2px rgba(20, 30, 54, 0.06), 0 8px 24px rgba(20, 30, 54, 0.06);
    --display: "Bodoni Moda", "Didot", "Times New Roman", serif;
    --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1522; --surface: #171F30; --surface-2: #1D2638;
      --ink: #EEF1F7; --ink-2: #B6BECF; --ink-3: #7F889C;
      --line: #2B354A; --line-2: #222B3D;
      --primary: #8AA3EE; --primary-ink: #0F1522; --primary-soft: #23304F;
      --accent: #F0A24B; --accent-soft: #3A2A14; --accent-ink: #F7D5A8;
      --good: #5BC28A; --good-soft: #1D3A2B; --warn: #EF7F68; --warn-soft: #43241E;
      --heat-0: #202A3D; --heat-1: #4E3820; --heat-2: #A6652A; --heat-3: #F0A24B;
      --pattern: rgba(138, 163, 238, 0.09);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1522; --surface: #171F30; --surface-2: #1D2638;
    --ink: #EEF1F7; --ink-2: #B6BECF; --ink-3: #7F889C;
    --line: #2B354A; --line-2: #222B3D;
    --primary: #8AA3EE; --primary-ink: #0F1522; --primary-soft: #23304F;
    --accent: #F0A24B; --accent-soft: #3A2A14; --accent-ink: #F7D5A8;
    --good: #5BC28A; --good-soft: #1D3A2B; --warn: #EF7F68; --warn-soft: #43241E;
    --heat-0: #202A3D; --heat-1: #4E3820; --heat-2: #A6652A; --heat-3: #F0A24B;
    --pattern: rgba(138, 163, 238, 0.09);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  input, textarea { font: inherit; color: var(--ink); }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }

  .shell { max-width: 760px; margin: 0 auto; padding: 0 16px 92px; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 10px; gap: 12px; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 { font-family: var(--display); font-weight: 600; font-size: 22px; }
  .brand .sub { font-size: 12px; color: var(--ink-3); }
  .sync { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
  .sync.on i { background: var(--good); }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); }
  nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 10px; color: var(--ink-3); font-size: 10.5px; font-weight: 500; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button[aria-current="page"] { color: var(--primary); }
  @media (min-width: 720px) {
    .shell { padding-bottom: 40px; }
    nav.tabs { position: sticky; top: 0; bottom: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    nav.tabs button { flex-direction: row; gap: 8px; font-size: 13.5px; padding: 8px 12px; justify-content: center; }
    nav.tabs button svg { width: 18px; height: 18px; }
    nav.tabs button[aria-current="page"] { background: var(--primary-soft); }
  }

  section.block { margin-top: 24px; }
  .block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .block-head h2 { font-family: var(--display); font-weight: 600; font-size: 21px; }
  .block-head .meta { font-size: 12.5px; color: var(--ink-3); text-align: right; }
  .panel { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; }
  .empty { color: var(--ink-3); font-size: 13.5px; padding: 14px 16px; }

  /* hero */
  .hero { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow); padding: 22px 20px 18px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
  .hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-radial-gradient(circle at 0 100%, transparent 0 22px, var(--pattern) 22px 23px), repeating-radial-gradient(circle at 100% 0, transparent 0 22px, var(--pattern) 22px 23px);
    mask-image: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(0,0,0,0.25) 55%, rgba(0,0,0,0.9)); -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(0,0,0,0.25) 55%, rgba(0,0,0,0.9)); }
  .hero > * { position: relative; }
  .streak-num { display: flex; align-items: center; gap: 12px; }
  .streak-num .n { font-family: var(--display); font-weight: 600; font-size: 72px; line-height: 0.95; letter-spacing: -0.01em; color: var(--ink-3); }
  .streak-num.on .n { color: var(--accent); }
  .flame-big { width: 62px; height: 80px; display: block; }
  .flame-off { color: var(--ink-3); } .flame-on { color: var(--accent); }
  .streak-label { font-size: 14px; color: var(--ink-2); margin-top: 6px; font-weight: 500; }
  .streak-label.on { color: var(--accent); font-weight: 600; }
  .streak-label.risk { color: var(--ink-2); }
  .week { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding-top: 14px; border-top: 1px solid var(--line-2); position: relative; }
  .week::before { content: ""; position: absolute; left: calc(100% / 14); right: calc(100% / 14); top: 53px; height: 2px; background: var(--line-2); }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; padding: 0; }
  .wd .l { font-size: 11px; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 500; line-height: 16px; }
  .wd .l.t { color: var(--ink); }
  .wd .c { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent; position: relative; z-index: 1; transition: transform 0.15s; }
  .wd:hover .c { transform: scale(1.06); }
  .wd .c svg { width: 18px; height: 18px; }
  .wd .c.full { background: var(--accent); border-color: var(--accent); color: #fff; }
  .wd .c.part { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .wd .c.today { border-color: var(--accent); border-style: dashed; }
  .wd .c.future { border-color: var(--line-2); background: transparent; }
  .wd .c.miss { border-color: var(--line); background: var(--surface-2); }
  .wd .h { font-size: 10.5px; color: var(--ink-3); font-family: var(--mono); line-height: 14px; min-height: 14px; }
  .day-edit-hero { grid-column: 1 / -1; padding-top: 12px; border-top: 1px solid var(--line-2); }
  .day-edit .hours-head, .day-edit-hero .hours-head { align-items: center; }
  .day-edit .hours-head > span:last-child, .day-edit-hero .hours-head > span:last-child { display: flex; gap: 6px; }
  @media (prefers-reduced-motion: reduce) { .wd .c { transition: none; } }
  .streak-stats { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
  .streak-stats b { color: var(--ink); font-weight: 600; }
  .ring { width: 108px; height: 108px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .track { stroke: var(--line-2); }
  .ring .fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
  .ring.safe .fill { stroke: var(--good); }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .center b { font-family: var(--display); font-size: 26px; font-weight: 600; line-height: 1; }
  .ring .center span { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 4px; }
  .hours-wrap { grid-column: 1 / -1; padding-top: 14px; border-top: 1px solid var(--line-2); }
  .hours-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .hours-head .eyebrow { color: var(--ink-2); }
  .hours-head span:last-child { font-size: 12px; color: var(--ink-3); }
  .hours { display: flex; gap: 8px; flex-wrap: wrap; }
  .hb { flex: 1 1 0; min-width: 52px; height: 46px; border-radius: 10px; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); background: var(--surface); transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .hb:hover { border-color: var(--accent); color: var(--ink); }
  .hb.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hb.extra.on { background: var(--good); border-color: var(--good); }
  .hb.add { border-style: dashed; flex: 0 0 auto; padding: 0 12px; }
  .hero-status { grid-column: 1 / -1; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 13.5px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  .hero-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .hero-status.safe .dot { background: var(--good); } .hero-status.cold .dot { background: var(--ink-3); }
  @media (prefers-reduced-motion: reduce) { .ring .fill, .hb { transition: none; } }

  .strip { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; background: var(--primary-soft); color: var(--ink); font-size: 13.5px; }
  .strip b { font-weight: 600; }
  .strip .link { color: var(--primary); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .strip .sep { color: var(--ink-3); }

  /* shift cards */
  .shift { margin-top: 14px; }
  .shift-head { padding: 12px 16px 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; border-bottom: 1px solid var(--line-2); }
  .shift-head .eyebrow { color: var(--primary); }
  .shift-head h3 { font-family: var(--display); font-weight: 600; font-size: 19px; }
  .shift-head .hrs { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .shift-head .sub { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }

  /* rows */
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line-2); }
  .rows .row:first-child { border-top: 0; }
  .row .check { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: transparent; background: var(--surface); transition: background 0.15s, border-color 0.15s; flex: none; }
  .row .check:hover { border-color: var(--accent); }
  .row .check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row .check.done { background: var(--good); border-color: var(--good); color: #fff; }
  .row .check svg { width: 16px; height: 16px; }
  .row .body { min-width: 0; }
  .row .name { font-weight: 500; font-size: 14.5px; line-height: 1.3; }
  .row .name.s2 { color: var(--ink-3); }
  .row .name.struck { color: var(--ink-3); text-decoration: line-through; }
  .row .crumb { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); font-size: 11px; font-weight: 500; }
  .tag.late { background: var(--warn-soft); color: var(--warn); }
  .tag.opt { color: var(--ink-3); }
  .tag.rev { background: var(--primary-soft); color: var(--primary); }
  .tag.today { background: var(--accent-soft); color: var(--accent-ink); }
  .tag.good { background: var(--good-soft); color: var(--good); }
  .row .acts { display: flex; gap: 6px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
  .btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  .btn.quiet { border-color: transparent; color: var(--ink-3); padding: 6px 6px; }
  .btn.quiet:hover { color: var(--ink); background: var(--surface-2); }
  .btn.danger { color: var(--warn); border-color: var(--warn); }
  .btn.sm { padding: 4px 8px; font-size: 12px; }
  .pill { font-size: 11px; font-weight: 500; letter-spacing: 0.02em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.done { background: var(--good-soft); color: var(--good); }

  /* heatmap */
  .heat-wrap { padding: 14px 14px 12px; overflow-x: auto; }
  .heat-months { display: grid; grid-auto-flow: column; grid-auto-columns: 14px; gap: 3px; margin-bottom: 4px; font-size: 10px; color: var(--ink-3); height: 12px; }
  .heat-months span { white-space: nowrap; }
  .heat { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 3px; }
  .heat i, .heat button { display: block; width: 14px; height: 14px; border-radius: 3px; background: var(--heat-0); padding: 0; border: 0; }
  .heat button:hover { outline: 1.5px solid var(--ink-3); outline-offset: -1.5px; }
  .heat .l1 { background: var(--heat-1); } .heat .l2 { background: var(--heat-2); } .heat .l3 { background: var(--heat-3); }
  .heat .today { outline: 1.5px solid var(--ink); outline-offset: -1.5px; }
  .heat button.sel { outline: 2px solid var(--primary); outline-offset: -2px; }
  .heat-hint { margin-top: 10px; font-size: 11.5px; color: var(--ink-3); }
  .day-edit { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-2); }
  .day-edit .hours-head .eyebrow { color: var(--ink); }
  input.hin { width: 68px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
  .heat i.future { background: transparent; border: 1px dashed var(--line-2); }
  .heat-legend { display: flex; gap: 12px; align-items: center; margin-top: 10px; font-size: 11.5px; color: var(--ink-3); flex-wrap: wrap; }
  .heat-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; background: var(--heat-0); }
  .heat-legend i.l1 { background: var(--heat-1); } .heat-legend i.l2 { background: var(--heat-2); } .heat-legend i.l3 { background: var(--heat-3); }

  /* plan */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .search { flex: 1; min-width: 160px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .comp { margin-top: 14px; }
  .comp-head { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; }
  .comp-head h3 { font-family: var(--display); font-weight: 600; font-size: 19px; }
  .comp-head .meta { font-size: 12px; color: var(--ink-3); margin-top: 3px; line-height: 1.5; }
  .comp-head .pct { font-family: var(--display); font-size: 22px; font-weight: 600; text-align: right; }
  .comp-head .pct small { display: block; font-family: var(--body); font-size: 11px; color: var(--ink-3); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
  .bar { height: 5px; background: var(--line-2); border-radius: 3px; overflow: hidden; margin: 0 16px; }
  .bar b { display: block; height: 100%; background: var(--good); border-radius: 3px; }
  .comp.collapsed .comp-body { display: none; }
  .comp-body { padding-top: 8px; }
  .comp-note { font-size: 12.5px; color: var(--ink-2); padding: 6px 16px 10px; line-height: 1.5; }
  .row.compact { padding: 9px 16px; }
  .row.compact .check { width: 26px; height: 26px; }
  .row.compact .name { font-size: 14px; font-weight: 400; }
  .comp-foot { display: flex; gap: 8px; justify-content: space-between; align-items: center; padding: 8px 12px 12px; flex-wrap: wrap; }
  .add-form { display: flex; gap: 8px; padding: 6px 14px 12px; flex-wrap: wrap; }
  .add-form input[type="text"] { flex: 1; min-width: 160px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
  .add-form input[type="date"] { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }

  /* todo */
  .todo-add { padding: 12px 14px; }
  .todo-add .add-form { padding: 0; }
  .todo-head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 16px 4px; }
  .todo-head .eyebrow { color: var(--primary); }

  /* progress */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; }
  .tile .v { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.1; }
  .tile .v small { font-family: var(--body); font-size: 13px; color: var(--ink-3); font-weight: 500; }
  .tile .k { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
  @media (max-width: 480px) { .tiles { gap: 8px; } .tile { padding: 10px; } .tile .v { font-size: 22px; } }
  .pace { padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; font-size: 13.5px; }
  .pace .k { color: var(--ink-3); font-size: 12px; }
  .pace .v { font-weight: 600; font-size: 15px; margin-top: 1px; }
  .pace .v.warnc { color: var(--warn); } .pace .v.goodc { color: var(--good); }
  .pace .note2 { grid-column: 1 / -1; color: var(--ink-2); font-size: 13px; border-top: 1px solid var(--line-2); padding-top: 10px; }
  .prog-list { padding: 4px 0 6px; }
  .prog-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; padding: 10px 16px 0; }
  .prog-row .n { font-size: 14px; font-weight: 500; }
  .prog-row .n small { color: var(--ink-3); font-weight: 400; margin-left: 6px; font-size: 12px; }

  if (!remoteRef) return;
  if (writing) { pendingWrite = true; return; }
  writing = true;
  try { await remoteRef.set(JSON.parse(JSON.stringify(S))); setSync(true); } catch (e) { setSync(false); }
  finally { writing = false; if (pendingWrite) { pendingWrite = false; flush(); } }
}
function setSync(on) { const el = document.getElementById("sync"); el.classList.toggle("on", on); el.querySelector("span").textContent = on ? "Synced to your account" : "Saved on this device"; }
async function initSync() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  let db, user;
  try { [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); } catch (e) { return; }
  if (!db || !user) return;
  const uid = await user.id(); if (!uid) return;
  const ref = db.doc("data/users/" + uid + "/planner");
  let snap; try { snap = await ref.get(); } catch (e) { return; }
  remoteRef = ref;
  if (snap.exists) {
    const r = snap.data();
    if ((r.updatedAt || 0) > (S.updatedAt || 0) || !hasActivity(S)) { S = migrate(r); persistLocal(); render(); }
    else if ((S.updatedAt || 0) > (r.updatedAt || 0)) flush();
  } else if (hasActivity(S)) flush();
  setSync(true);
  ref.onSnapshot((sn) => {
    if (!sn.exists || sn.metadata.hasPendingWrites) return;
    const r = sn.data();
    if ((r.updatedAt || 0) > (S.updatedAt || 0)) { S = migrate(r); persistLocal(); render(); }
  }, () => {});
}

/* ---------- plan engine ---------- */
function planPos(date = ymd()) { const off = diffDays(S.settings.planStart, date); return { off, week: Math.floor(off / 7) + 1, dow: ((off % 7) + 7) % 7 + 1 }; }
function blockFor(week) { return SCHEDULE.find((b) => week >= b.w[0] && week <= b.w[1]) || null; }
function compDay(c, week, dow) { return (week - c.startWeek) * 7 + dow; }
function chapterDate(t, day) { return addDays(S.settings.planStart, (t.comp.startWeek - 1) * 7 + (day - 1)); }
function chaptersOn(c, day) { return c.topics.filter((t) => t.days.includes(day)); }
function weekChapters(c, week) { const d1 = compDay(c, week, 1); return c.topics.filter((t) => t.days.some((d) => d >= d1 && d <= d1 + 5)); }
function revList(block) { return block.s2.rev.flatMap((id) => COMP[id].topics.filter((t) => !t.opt)); }
function revisionOn(block, week, dow) { const list = revList(block), days = (block.w[1] - block.w[0] + 1) * 6, idx = (week - block.w[0]) * 6 + (dow - 1); return list.filter((t, i) => Math.floor((i * days) / list.length) === idx); }
function revisionWeek(block, week) { const list = revList(block), days = (block.w[1] - block.w[0] + 1) * 6, lo = (week - block.w[0]) * 6, hi = lo + 5; return list.filter((t, i) => { const k = Math.floor((i * days) / list.length); return k >= lo && k <= hi; }); }
function behindList(date = ymd()) {
  const { week, dow } = planPos(date), out = [];
  for (const c of COMPONENTS) { const cd = compDay(c, week, dow); for (const t of c.topics) if (!t.opt && t.lastDay < cd && tstat(t.id).s !== 2) out.push(t); }
  return out;
}
function scheduledSoFar(date = ymd()) { const { week, dow } = planPos(date); let n = 0; for (const c of COMPONENTS) { const cd = compDay(c, week, dow); for (const t of c.topics) if (!t.opt && t.lastDay <= cd) n++; } return n; }
function fmtRanges(t) { return t.ranges.length ? "Day " + t.ranges.map(([a, b]) => (a === b ? a : a + "–" + b)).join(", ") : ""; }
function fmtWindow(t) { if (!t.days.length) return ""; const a = chapterDate(t, t.days[0]), b = chapterDate(t, t.lastDay); return a === b ? fmtDate(a, "wd") : fmtDate(a, "wd") + " – " + fmtDate(b, "wd"); }

/* ---------- hours & streak ---------- */
function hoursOn(d) { return (S.days[d] && S.days[d].h) || 0; }
function studied(d) { return hoursOn(d) >= 1; }
function goalMet(d) { return hoursOn(d) >= S.settings.goal; }
function streakInfo() {
  const today = ymd();
  let cur = 0, d = studied(today) ? today : addDays(today, -1);
  while (studied(d) && cur < 5000) { cur++; d = addDays(d, -1); }
  const dates = Object.keys(S.days).filter(studied).sort();
  let longest = 0, run = 0, prev = null;
  for (const k of dates) { run = prev && diffDays(prev, k) === 1 ? run + 1 : 1; longest = Math.max(longest, run); prev = k; }
  return { cur, longest: Math.max(longest, cur), todayH: hoursOn(today), goal: S.settings.goal, studiedToday: studied(today), goalToday: goalMet(today),
    studiedDays: dates.length, goalDays: Object.keys(S.days).filter(goalMet).length, totalHours: Object.values(S.days).reduce((a, x) => a + (x.h || 0), 0) };
}
function rangeHours(from, to) { let h = 0, days = 0, goal = 0; for (let d = from; d <= to; d = addDays(d, 1)) { const x = hoursOn(d); h += x; if (x >= 1) days++; if (x >= S.settings.goal) goal++; } return { h, days, goal }; }
function tstat(id) { return S.topics[id] || { s: 0 }; }
function compProgress(c) { const core = c.topics.filter((t) => !t.opt), done = core.filter((t) => tstat(t.id).s === 2).length, prog = core.filter((t) => tstat(t.id).s === 1).length; return { total: core.length, done, prog, pct: core.length ? Math.round((done / core.length) * 100) : 0 }; }

/* ---------- actions ---------- */
function ensureDay(d) { return S.days[d] || (S.days[d] = { h: 0, t: [] }); }
function tidyDay(d) { const x = S.days[d]; if (x && !x.h && !x.t.length) delete S.days[d]; }
function setHours(n, date = ymd()) {
  const today = ymd(), day = ensureDay(date), before = day.h;
  day.h = Math.max(0, Math.min(24, n)); tidyDay(date);
  const s = streakInfo();
  if (date !== today) toast(day.h === 0 ? "Hours cleared for " + fmtDate(date, "wd") : day.h + " h logged for " + fmtDate(date, "wd") + (day.h >= s.goal ? " · goal day" : "") + " · streak " + s.cur);
  else if (day.h === 0 && before > 0) toast("Hours cleared for today");
  else if (day.h >= s.goal && before < s.goal) toast("Goal met · " + day.h + " h today. Day " + s.cur + " of your streak.");
  else if (before === 0 && day.h > 0) toast("Streak safe · day " + s.cur);
  else toast(day.h + " h logged today");
  save(); render();
}
function backfill(from, to, h) {
  const today = ymd();
  if (!from || !to || from > to) { toast("Pick a valid date range"); return; }
  if (to > today) to = today;
  h = Math.max(1, Math.min(24, Number(h) || 0));
  const n = diffDays(from, to) + 1;
  if (n > 400) { toast("That range is too long"); return; }
  if (!confirm("Log " + h + " h on each of " + n + " days, " + fmtDate(from) + " to " + fmtDate(to) + "? Days that already have more hours keep them.")) return;
  for (let d = from; d <= to; d = addDays(d, 1)) { const day = ensureDay(d); day.h = Math.max(day.h, h); }
  save(); render(); toast(n + (n === 1 ? " day" : " days") + " logged · streak " + streakInfo().cur);
}
function checkIn(id) {
  const today = ymd(), day = ensureDay(today), tp = S.topics[id] || (S.topics[id] = { s: 0 });
  if (day.t.includes(id)) { day.t = day.t.filter((x) => x !== id); tidyDay(today); toast("Removed from today"); }
  else { day.t.push(id); tp.last = today; if (tp.s === 0) tp.s = 1; if (tp.s === 2) tp.rev = (tp.rev || 0) + 1; toast(tp.s === 2 ? "Revision logged" : "Worked on today · mark Done when the chapter is finished"); }
  save(); render();
}
function markDone(id) {
  const today = ymd(), tp = S.topics[id] || (S.topics[id] = { s: 0 });
  tp.s = 2; tp.doneAt = today; tp.last = today;
  const day = ensureDay(today); if (!day.t.includes(id)) day.t.push(id);
  save(); render(); toast("Chapter done");
}
function reopen(id) { const tp = S.topics[id]; if (!tp) return; tp.s = 1; delete tp.doneAt; save(); render(); toast("Moved back to in progress"); }
function markAllDone(compId) { const today = ymd(); for (const t of COMP[compId].topics) { if (t.opt) continue; const tp = S.topics[t.id] || (S.topics[t.id] = { s: 0 }); if (tp.s !== 2) { tp.s = 2; tp.doneAt = tp.doneAt || today; } } save(); render(); toast(COMP[compId].name + " marked complete"); }
function addCustom(compId, name) { name = (name || "").trim(); if (!name) return; (S.custom[compId] || (S.custom[compId] = [])).push({ id: "c." + Date.now().toString(36), name }); UI.addingTo = null; save(); buildIndex(); render(); toast("Chapter added"); }
function removeCustom(id) { for (const k of Object.keys(S.custom)) S.custom[k] = S.custom[k].filter((c) => c.id !== id); delete S.topics[id]; save(); buildIndex(); render(); }
function addTodo(text, due) { text = (text || "").trim(); if (!text) return; S.todos.push({ id: "t." + Date.now().toString(36), text, due: due || "", done: false, created: ymd() }); UI.focusTodo = true; save(); render(); }
function toggleTodo(id) { const t = S.todos.find((x) => x.id === id); if (!t) return; t.done = !t.done; t.doneAt = t.done ? ymd() : ""; save(); render(); }
function removeTodo(id) { S.todos = S.todos.filter((x) => x.id !== id); save(); render(); }
function clearDoneTodos() { S.todos = S.todos.filter((x) => !x.done); save(); render(); toast("Done items cleared"); }

/* ---------- render helpers ---------- */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const ICON_FLAME = '<svg viewBox="0 0 24 32" fill="currentColor"><path d="M12 1c1.4 4.6 6.2 6.8 6.2 13.4 0 4.8-3.3 8.6-8.2 8.6S3.8 19.2 3.8 14.4c0-2.3.8-4.1 1.7-5.6.7 2.4 2 3.4 3 3.4-.3-4.6-1.2-8 3.5-11.2zM10 25.5c-1.5 1.5-1.5 3.3 0 4.5h4c1.5-1.2 1.5-3 0-4.5-1 1-3 1-4 0z"/></svg>';

function topicRow(t, opts = {}) {
  const today = ymd(), x = tstat(t.id);
  const checked = !!(S.days[today] && S.days[today].t.includes(t.id));
  let tags = "";
  if (opts.tag === "late") tags += '<span class="tag late">Behind · was ' + esc(fmtWindow(t)) + "</span>";
  if (opts.tag === "rev") tags += '<span class="tag rev">Revise</span>';
  if (opts.tag === "today" && t.days.length > 1 && opts.day) tags += '<span class="tag today">Day ' + (t.days.indexOf(opts.day) + 1) + " of " + t.days.length + "</span>";
  if (opts.showWindow && t.days.length) tags += "<span>" + esc(fmtRanges(t)) + " · " + esc(fmtWindow(t)) + "</span>";
  if (t.opt) tags += '<span class="tag opt">' + esc(t.note || "Optional") + "</span>"; else if (t.note) tags += "<span>" + esc(t.note) + "</span>";
  if (opts.crumb) tags += "<span>" + esc(t.comp.name) + "</span>";

    ? '<button class="pill done" data-act="reopen:' + t.id + '" title="Move back to in progress">Done' + (x.rev ? " · revised ×" + x.rev : "") + "</button>"
    : '<button class="btn sm" data-act="done:' + t.id + '" title="Finished this chapter">Done</button>';

    '<button class="check' + (checked ? (x.s === 2 ? " done" : " on") : "") + '" data-act="checkin:' + t.id + '" aria-pressed="' + checked + '" title="' + (checked ? "Worked on today · tap to undo" : "Worked on this today") + '">' + ICON_CHECK + "</button>" +
    '<div class="body"><div class="name' + (x.s === 2 ? " s2" : "") + '">' + esc(tname(t)) + "</div>" + (tags ? '<div class="crumb">' + tags + "</div>" : "") + "</div>" +
    '<div class="acts">' + acts + custom + "</div></div>";
}

function weekStrip() {

    (UI.editDay && UI.editDay <= today ? dayEditor("day-edit") : '<div class="heat-hint">Tap any day to log or fix its hours.</div>') + "</div>";
}

/* ---------- Today ---------- */
function shiftCard(label, block, shift, week, dow) {
  const spec = block[shift], isSun = dow === 7;
  let title, sub, hours, rows;
  if (spec.c) {
    const c = COMP[spec.c], day = compDay(c, week, dow); hours = spec.hours || c.hours; title = c.name;
    if (isSun) { const list = weekChapters(c, week); sub = "Sunday revision · this week's chapters (days " + compDay(c, week, 1) + "–" + (compDay(c, week, 1) + 5) + ")"; rows = list.length ? list.map((t) => topicRow(t, { tag: "rev" })).join("") : '<div class="empty">No chapters scheduled this week.</div>'; }
    else { const list = chaptersOn(c, day); sub = "Day " + day + " of " + c.name; rows = list.length ? list.map((t) => topicRow(t, { tag: "today", day })).join("") : '<div class="empty">No new chapter today. Use the time to revise or catch up.</div>'; }
  } else {
    hours = spec.hours; title = "Revision · " + spec.rev.map((id) => COMP[id].name).join(", ");
    if (isSun) { sub = "Sunday · re-run this week's revision list"; rows = revisionWeek(block, week).map((t) => topicRow(t, { tag: "rev", crumb: spec.rev.length > 1 })).join(""); }
    else { const list = revisionOn(block, week, dow); sub = "Week " + (week - block.w[0] + 1) + " of " + (block.w[1] - block.w[0] + 1) + " revision weeks"; rows = list.length ? list.map((t) => topicRow(t, { tag: "rev", crumb: spec.rev.length > 1 })).join("") : '<div class="empty">Free revision slot. Pick your weakest chapters from the Plan tab.</div>'; }
  }
  return '<section class="panel shift"><div class="shift-head"><span class="eyebrow">' + label + '</span><span class="hrs">' + esc(hours) + "</span><h3>" + esc(title) + '</h3><span class="sub">' + esc(sub) + '</span></div><div class="rows">' + rows + "</div></section>";
}

function renderToday() {
  const s = streakInfo(), today = ymd(), pos = planPos(today), block = blockFor(pos.week);
  let status, cls;
  if (s.goalToday) { status = "Goal met with " + s.todayH + " h. Streak is day " + s.cur + ". Extra hours still count."; cls = "safe"; }
  else if (s.studiedToday) { status = s.todayH + " h in. Streak safe. " + (s.goal - s.todayH) + " more " + (s.goal - s.todayH === 1 ? "hour" : "hours") + " hits today's goal."; cls = "safe"; }
  else if (s.cur > 0) { status = "Nothing logged yet. One hour today keeps your " + s.cur + "-day streak alive."; cls = ""; }
  else { status = "Log your first hour today to start the streak."; cls = "cold"; }
  const lit = s.cur > 0 && s.studiedToday;
  const label = lit ? "day streak" + (s.goalToday ? " · goal met" : "") : s.cur > 0 ? "day streak · at risk" : "day streak";

  let html = '<section class="block" style="margin-top:8px"><div class="hero"><div>' +
    '<div class="streak-num' + (lit ? " on" : "") + '">' + flameBig(lit) + '<span class="n num">' + s.cur + '</span></div><div class="streak-label' + (lit ? " on" : s.cur > 0 ? " risk" : "") + '">' + label + "</div>" +
    '<div class="streak-stats"><span>Best <b class="num">' + s.longest + '</b></span><span>Goal days <b class="num">' + s.goalDays + '</b></span><span>Total <b class="num">' + s.totalHours + " h</b></span></div></div>" +
    ringSvg(s.todayH, s.goal, s.goalToday) +
    weekStrip() + dayEditor("day-edit-hero") +
    '<div class="hours-wrap"><div class="hours-head"><span class="eyebrow">Hours today</span><span>Tap each hour as you finish it</span></div><div class="hours">' + hourBlocks() + "</div></div>" +
    '<div class="hero-status ' + cls + '"><span class="dot"></span><span>' + status + "</span></div></div>";

  let strip;
  if (pos.week < 1) strip = "<span>Plan starts <b>" + fmtDate(S.settings.planStart, "full") + "</b> with Management and Reasoning.</span><button class=\"link\" data-act=\"nav:settings\">Change start</button>";
  else if (pos.week > PLAN_WEEKS) strip = "<span><b>Plan complete</b> · 39 weeks done. Final stretch below.</span>";
  else strip = "<span><b>Week " + pos.week + "</b> of " + PLAN_WEEKS + ' <span class="sep">·</span> ' + DOW[pos.dow - 1] + ", " + fmtDate(today) + "</span>" +
    (S.settings.examDate ? '<span class="num">' + Math.max(0, diffDays(today, S.settings.examDate)) + " days to exam" + (S.settings.examAssumed ? " (assumed)" : "") + "</span>" : '<button class="link" data-act="nav:settings">Set exam date</button>');
  html += '<div class="strip">' + strip + "</div></section>";

  if (block) {
    html += '<section class="block"><div class="block-head"><h2>' + (pos.dow === 7 ? "Sunday revision" : "Today's shifts") + '</h2><span class="meta">Tick a chapter when you work on it · Done when finished</span></div>' +
      shiftCard("Shift 1", block, "s1", pos.week, pos.dow) + shiftCard("Shift 2", block, "s2", pos.week, pos.dow) + "</section>";
  } else if (pos.week > PLAN_WEEKS) {

      "<p><b>Notification to Phase 1 (about 6 weeks).</b> Shift 1: revise covered current affairs and keep adding new months, 2 h/day and 4 h Saturday. Shift 2: practise Quant, Reasoning and English with sectional mocks. Mock tests on Sundays. Final week: a daily exam-like mock.</p>" +
      "<p><b>Phase 1 to Phase 2 (about 3 weeks).</b> Revise current affairs 1 h/day, cover new current affairs 1 h/day, and revise Finance, Management and ESI 2 h/day. Final week: two full mocks, analysed.</p></div></section>";
  }

  const behind = behindList(today);
  if (behind.length && pos.week >= 1) {
    html += '<section class="block"><div class="block-head"><h2>Catch up</h2><span class="meta">' + behind.length + " chapter" + (behind.length > 1 ? "s" : "") + ' past plan days</span></div><div class="panel rows">' +
      behind.slice(0, 6).map((t) => topicRow(t, { tag: "late", crumb: true })).join("") + (behind.length > 6 ? '<div class="empty">' + (behind.length - 6) + " more in the Plan tab.</div>" : "") + "</div></section>";
  }

  const open = S.todos.filter((t) => !t.done);
  if (open.length) {
    const due = open.filter((t) => t.due && t.due <= today);
    html += '<section class="block"><div class="block-head"><h2>To-do</h2><span class="meta">' + (due.length ? due.length + " due" : open.length + " open") + '</span></div><div class="panel rows">' +
      (due.length ? due : open.slice(0, 4)).map(todoRow).join("") + '<div class="comp-foot"><button class="btn quiet sm" data-act="nav:todo">Open the full list</button></div></div></section>';
  }

  html += '<section class="block"><div class="block-head"><h2>Last 16 weeks</h2><span class="meta">Goal ' + s.goal + " h a day</span></div><div class=\"panel\">" + heatmap(16) + "</div></section>";
  return html;
}

/* ---------- Plan ---------- */

/* ---------- To-do ---------- */

    '<div class="body"><div class="name' + (t.done ? " struck" : "") + '">' + esc(t.text) + "</div>" + (tag ? '<div class="crumb">' + tag + "</div>" : "") + "</div>" +

}

/* ---------- Progress ---------- */
function weeklyChart() {
  const today = ymd(), thisMon = thisMonday(today), goal = S.settings.goal * 7, weeks = [];
  for (let i = 11; i >= 0; i--) { const ws = addDays(thisMon, -i * 7); weeks.push({ ws, h: rangeHours(ws, addDays(ws, 6)).h }); }
  const max = Math.max(goal * 1.15, ...weeks.map((w) => w.h), 1);
  const W = 600, H = 170, padL = 30, padB = 24, padT = 10, cw = (W - padL - 8) / 12, bw = cw * 0.62;
  const y = (v) => padT + (H - padT - padB) * (1 - v / max);
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Hours per week, last 12 weeks">';
  for (const g of [0, 0.5, 1]) { const v = Math.round(max * g); svg += '<line class="grid" x1="' + padL + '" x2="' + W + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text x="' + (padL - 6) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + v + "h</text>"; }
  svg += '<line class="tline" x1="' + padL + '" x2="' + W + '" y1="' + y(goal).toFixed(1) + '" y2="' + y(goal).toFixed(1) + '"/>';
  weeks.forEach((w, i) => {
    const x = padL + i * cw + (cw - bw) / 2, h = Math.max(w.h ? 2 : 0, y(0) - y(w.h));
    svg += '<rect class="wbar' + (w.h >= goal ? " met" : "") + '" x="' + x.toFixed(1) + '" y="' + (y(0) - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"><title>Week of ' + fmtDate(w.ws) + " · " + w.h + " h</title></rect>";
    if (i % 3 === 2 || i === 11) svg += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + fmtDate(w.ws) + "</text>";
  });
  return svg + "</svg>";
}
function renderProgress() {
  const s = streakInfo(), today = ymd(), pos = planPos(today), goal = S.settings.goal;
  const mon = thisMonday(today), wk = rangeHours(mon, today);
  const m0 = today.slice(0, 8) + "01", mo = rangeHours(m0, today);
  const last30 = rangeHours(addDays(today, -29), today);
  const core = TOPICS.filter((t) => !t.opt), done = core.filter((t) => tstat(t.id).s === 2).length;
  const sched = scheduledSoFar(today), behind = behindList(today).length;

  let html = '<section class="block" style="margin-top:8px"><div class="tiles">' +
    '<div class="tile"><div class="v num">' + wk.h + ' <small>h</small></div><div class="k">This week · goal ' + goal * 7 + " h</div></div>" +
    '<div class="tile"><div class="v num">' + mo.h + ' <small>h</small></div><div class="k">' + MONTHS[parseYmd(today).getMonth()] + " so far · " + mo.days + (mo.days === 1 ? " day" : " days") + "</div></div>" +
    '<div class="tile"><div class="v num">' + (last30.h / 30).toFixed(1) + ' <small>h/day</small></div><div class="k">30-day average · streak ' + s.cur + "</div></div></div></section>";

  // weekly table
  const weekStarts = []; for (let i = 0; i < 8; i++) weekStarts.push(addDays(mon, -i * 7));
  html += '<section class="block"><div class="block-head"><h2>Hours per week</h2><span class="meta">Dashed line = ' + goal * 7 + " h</span></div><div class=\"panel\"><div class=\"chart-wrap\">" + weeklyChart() + '</div>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Week of</th><th class="r">Hours</th><th class="r">Days</th><th class="r">Goal days</th><th class="r">Avg/day</th></tr></thead><tbody>' +
    weekStarts.map((ws, i) => { const end = i === 0 ? today : addDays(ws, 6), r = rangeHours(ws, end), n = diffDays(ws, end) + 1;
      if (!r.h && i > 0 && ws < S.settings.planStart) return "";
      return "<tr><td" + (i === 0 ? ' class="cur"' : "") + ">" + fmtDate(ws) + (i === 0 ? ' <span class="dim">· this week</span>' : "") + '</td><td class="r' + (r.h >= goal * 7 ? " met" : "") + '">' + r.h + '</td><td class="r">' + r.days + '</td><td class="r">' + r.goal + '</td><td class="r">' + (r.h / n).toFixed(1) + "</td></tr>"; }).join("") +
    "</tbody></table></div></div></section>";

  // monthly table since plan start
  const months = []; let cur = S.settings.planStart.slice(0, 7); const end = today.slice(0, 7);
  while (cur <= end && months.length < 24) { months.push(cur); const [y, m] = cur.split("-").map(Number); cur = (m === 12 ? y + 1 : y) + "-" + pad(m === 12 ? 1 : m + 1); }
  if (!months.includes(end)) months.push(end);
  html += '<section class="block"><div class="block-head"><h2>Hours per month</h2><span class="meta">Since ' + fmtDate(S.settings.planStart) + '</span></div><div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Month</th><th class="r">Hours</th><th class="r">Days studied</th><th class="r">Goal days</th><th class="r">Avg/day</th></tr></thead><tbody>' +
    months.reverse().map((ym) => { const [y, m] = ym.split("-").map(Number); const first = ym + "-01", lastOfMonth = ymd(new Date(y, m, 0)); const to = lastOfMonth > today ? today : lastOfMonth; const r = rangeHours(first, to), n = diffDays(first, to) + 1;
      return "<tr><td" + (ym === end ? ' class="cur"' : "") + ">" + MONTHS[m - 1] + " " + y + (ym === end ? ' <span class="dim">· so far</span>' : "") + '</td><td class="r">' + r.h + '</td><td class="r">' + r.days + " / " + n + '</td><td class="r">' + r.goal + '</td><td class="r">' + (r.h / n).toFixed(1) + "</td></tr>"; }).join("") +
    "</tbody></table></div></section>";

  let verdict, vcls = "";
  if (pos.week < 1) verdict = "The plan starts on " + fmtDate(S.settings.planStart, "full") + ". Nothing is due yet.";
  else if (behind === 0) { verdict = "On track. Every chapter scheduled so far is done."; vcls = "goodc"; }
  else { verdict = behind + " chapter" + (behind > 1 ? "s are" : " is") + " past " + (behind > 1 ? "their" : "its") + " plan days. Use Sundays and Saturday hours to catch up, as the plan suggests."; vcls = "warnc"; }
  html += '<section class="block"><div class="block-head"><h2>Plan status</h2><span class="meta">Started ' + fmtDate(S.settings.planStart, "full") + '</span></div><div class="panel pace">' +
    '<div><div class="k">Plan week</div><div class="v num">' + (pos.week < 1 ? "Not started" : Math.min(PLAN_WEEKS, pos.week) + " of " + PLAN_WEEKS) + "</div></div>" +
    '<div><div class="k">Chapters done</div><div class="v num">' + done + " of " + core.length + "</div></div>" +
    '<div><div class="k">Scheduled so far</div><div class="v num">' + sched + "</div></div>" +
    '<div><div class="k">Behind</div><div class="v num ' + vcls + '">' + behind + "</div></div>" +
    (S.settings.examDate ? '<div><div class="k">Exam' + (S.settings.examAssumed ? " (assumed)" : "") + '</div><div class="v">' + fmtDate(S.settings.examDate, "full") + '</div></div><div><div class="k">Days left</div><div class="v num">' + Math.max(0, diffDays(today, S.settings.examDate)) + "</div></div>" : "") +
    '<div class="note2">' + verdict + "</div></div></section>";

  html += '<section class="block"><div class="block-head"><h2>By component</h2><span class="meta">In plan order</span></div><div class="panel prog-list">';
  for (const c of COMPONENTS) { const pr = compProgress(c), state = pos.week < c.startWeek ? "Starts week " + c.startWeek : pos.week > c.endWeek ? "Window over" : "Active now";
    html += '<div class="prog-row"><div class="n">' + esc(c.name) + "<small>Weeks " + c.startWeek + "–" + c.endWeek + " · " + state + '</small></div><div class="c num">' + pr.done + " / " + pr.total + '</div></div><div class="bar prog-bar"><b style="width:' + pr.pct + '%"></b></div>'; }
  return html + "</div></section>";
}

function render() {

/* ---------- events ---------- */
let toastTimer;
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2400); }

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const [act, arg] = btn.dataset.act.split(/:(.*)/s);
  switch (act) {
    case "nav": UI.view = arg; window.scrollTo({ top: 0 }); render(); break;
    case "hours": { const [d, n] = arg.split(":"); setHours(Number(n), d); break; }
    case "day": UI.editDay = UI.editDay === arg ? null : arg; render(); break;
    case "closeday": UI.editDay = null; render(); break;
    case "toggle": { const c = COMP[arg], pos = planPos(); const cur = UI.collapsed[arg] !== undefined ? UI.collapsed[arg] : !(pos.week >= c.startWeek && pos.week <= c.endWeek); UI.collapsed[arg] = !cur; render(); break; }
    case "checkin": checkIn(arg); break;
    case "done": markDone(arg); break;
    case "reopen": reopen(arg); break;
    case "alldone": if (confirm("Mark every chapter in " + COMP[arg].name + " as done?")) markAllDone(arg); break;
    case "add": UI.addingTo = arg; render(); break;
    case "cancel-add": UI.addingTo = null; render(); break;
    case "removecustom": if (confirm("Remove this chapter and its progress?")) removeCustom(arg); break;
    case "todo": toggleTodo(arg); break;
    case "rmtodo": removeTodo(arg); break;
    case "cleardone": if (confirm("Clear all done tasks?")) clearDoneTodos(); break;
    case "showdone": UI.showDone = true; render(); break;
    case "goal": { const g = Math.min(12, Math.max(1, S.settings.goal + Number(arg))); if (g !== S.settings.goal) { S.settings.goal = g; save(); render(); } break; }
    case "export": UI.showExport = !UI.showExport; UI.showImport = false; render(); break;
    case "import": UI.showImport = !UI.showImport; UI.showExport = false; render(); break;
    case "copy": { const box = document.getElementById("exportBox"); if (box) { box.select(); if (navigator.clipboard) navigator.clipboard.writeText(box.value).then(() => toast("Copied"), () => toast("Select the text and copy it manually")); } break; }
    case "doimport": {
      const box = document.getElementById("importBox");
      try { const data = JSON.parse(box.value); if (!data || typeof data !== "object" || !data.settings) throw new Error("bad");
        if (!confirm("Replace your current progress with this backup?")) break;
        S = migrate(data); UI.showImport = false; save(); buildIndex(); render(); toast("Backup restored");
      } catch (err) { toast("That text is not a valid backup"); }
      break;
    }
    case "reset": if (confirm("Reset progress? Hours, streaks, chapter status and to-dos will be cleared.")) { const st = S.settings; S = fresh(); S.settings = st; save(); buildIndex(); render(); toast("Progress reset"); } break;
  }
});
document.addEventListener("submit", (e) => {
  const f = e.target;
  if (f.id === "todoForm") { e.preventDefault(); addTodo(f.elements.text.value, f.elements.due.value); return; }
  if (f.id === "backfillForm") { e.preventDefault(); backfill(f.elements.from.value, f.elements.to.value, f.elements.h.value); return; }
  const af = f.closest(".add-form"); if (af && af.dataset.comp) { e.preventDefault(); addCustom(af.dataset.comp, af.elements.name.value); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "todoText") { e.preventDefault(); const f = document.getElementById("todoForm"); if (f) addTodo(f.elements.text.value, f.elements.due.value); } });
document.addEventListener("input", (e) => { if (e.target.id === "search") { UI.query = e.target.value; UI.focusSearch = true; render(); } });
document.addEventListener("change", (e) => {
  if (e.target.id === "examDate") { S.settings.examDate = e.target.value || ""; S.settings.examAssumed = false; save(); render(); toast(S.settings.examDate ? "Exam date set" : "Exam date cleared"); }
  if (e.target.id === "planStart" && e.target.value) { const mon = thisMonday(e.target.value); S.settings.planStart = mon; save(); render(); toast(mon === e.target.value ? "Plan start set" : "Snapped to Monday " + fmtDate(mon)); }
});

render();
initSync();
</script>
</body>
</html>
